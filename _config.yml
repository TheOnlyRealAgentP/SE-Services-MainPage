# Site-wide settings. Business details (phone, address, hours, towns,
# licenses) live in _data/business.yml, not here.

title: Stewart Engineering Services
description: >-
  Septic and aerobic system installation, maintenance and repair, plus civil
  engineering for builders and developers in Channelview and east Harris County, TX.
# Canonical address. Canonical links, the sitemap and Google's structured
# data always point here, even while the site is previewed on github.io.
url: "https://stewartengineeringservices.com"
# "baseurl" is deliberately NOT set. GitHub Pages fills it in automatically:
# "/SE-Services-MainPage" while the site is served from
# theonlyrealagentp.github.io/SE-Services-MainPage/, and empty once the
# custom domain is connected. The default layout adds it to every link.
lang: en_US

# Yellow "TODO" markers for missing facts and photos (see TODO.md).
# false = hidden on the site: unfinished items are left out, missing photos
# show a neutral blueprint panel, and each marker stays in the page source as
# an HTML comment so scripts/check_site.py can still count them.
# To see the markers while editing:
#   bundle exec jekyll serve --baseurl "" --config _config.yml,_config.todos.yml
show_todos: false

# Used by jekyll-seo-tag for Open Graph / social cards.
logo: /assets/img/logo.png
social:
  name: Stewart Engineering Services
  links:
    - https://www.facebook.com/StewartAerobic

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-image.jpg

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

# Files that are part of the repo but not part of the website.
exclude:
  - README.md
  - DEPLOY.md
  - LAUNCH-CHECKLIST.md
  - TODO.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - .bundle
  - .gitignore
