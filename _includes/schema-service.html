{%- assign b = site.data.business -%}
{%- assign svc = site.data.services | where: "id", page.service_id | first -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ svc.title | jsonify }},
  "serviceType": {{ page.service_type | default: svc.title | jsonify }},
  "description": {{ page.description | strip | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "provider": { "@id": "{{ b.url }}/#business" },
  "areaServed": [
    {%- for t in b.towns %}
    { "@type": "City", "name": {{ t.name | append: ", TX" | jsonify }} }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
